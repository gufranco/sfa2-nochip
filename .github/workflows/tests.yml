name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run every test module
        run: |
          failed=0
          for module in *.test.py; do
            echo "::group::${module}"
            python3 "${module}" || failed=1
            echo "::endgroup::"
          done
          exit "${failed}"
